<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant - PC BUILDER</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<div class="navbar">
  <div class="nav-container">
    <div class="logo">Bamboo PC <i class="fa-solid fa-computer"></i></div>
    
  </div>
</div>

<div class="page-title">AI Assistant 🤖
  <p>Your Personal PC Building AI Guide</p>
  <p>Ask me anything about building your dream PC!</p>
  <p>I can't provide detailed info on Gaming Laptops</p>
</div>

<div class="container">
  <div id="chatBox" class="chat-box">
    <p><b>AI Assistant:</b> Hello! What Are We Planning to Build?</p>
  </div>

  <div class="input-area">
    <input id="userInput" placeholder="Ask about PC building..." />
    <button onclick="sendMsg()">Send</button>
  </div>
</div>

<script src="chat.js"></script>
</body>
</html>
